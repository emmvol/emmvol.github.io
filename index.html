  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;

      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }.container {
  width: 90%;
  max-width: 1000px;
  background: rgba(0,0,0,0.25);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 0 20px rgba(0,0,0,0.3);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.question-counter {
  text-align: center;
  margin-bottom: 20px;
  font-size: 18px;
}

.question {
  font-size: 24px;
  margin-bottom: 25px;
  line-height: 1.5;
}

.answers {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

button.answer {
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  border: none;
  border-radius: 15px;
  padding: 18px;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s ease, opacity 0.2s ease;
  color: white;
  font-weight: bold;
}

button.answer:hover {
  transform: scale(1.03);
  opacity: 0.9;
}

.a { background: #e53935; }
.b { background: #1e88e5; }
.c { background: #43a047; }
.d { background: #fbc02d; color: black; }
.e { background: #8e24aa; }

.correct {
  outline: 5px solid #00ff99;
}

.incorrect {
  outline: 5px solid #ff1744;
}

.controls {
  margin-top: 25px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.score {
  font-size: 20px;
  font-weight: bold;
}

.next-btn {
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  background: white;
  color: black;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
}

.explanation {
  margin-top: 20px;
  padding: 15px;
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  display: none;
}

.final-screen {
  text-align: center;
  display: none;
}

@media(max-width: 768px) {
  .answers {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 20px;
  }
}

  </style>
</head>

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionEl = document.getElementById('question');
const answersEl = document.getElementById('answers');
const counterEl = document.getElementById('counter');
const scoreEl = document.getElementById('score');
const explanationEl = document.getElementById('explanation');
const nextBtn = document.getElementById('nextBtn');

function loadQuestion() {
  answered = false;
  nextBtn.disabled = true;
  explanationEl.style.display = 'none';

  const q = questions[currentQuestion];

  counterEl.textContent = `Pregunta ${currentQuestion + 1} de ${questions.length}`;
  questionEl.textContent = q.q;

  answersEl.innerHTML = '';

  const classes = ['a','b','c','d','e'];

  q.options.forEach((option, index) => {
    const btn = document.createElement('button');
    btn.classList.add('answer', classes[index]);
    btn.textContent = `${String.fromCharCode(65 + index)}) ${option}`;
    btn.onclick = () => selectAnswer(index, btn);
    answersEl.appendChild(btn);
  });
}

function selectAnswer(index, btn) {
  if(answered) return;
  answered = true;

  const q = questions[currentQuestion];
  const buttons = document.querySelectorAll('.answer');

  buttons.forEach((b, i) => {
    if(i === q.answer) {
      b.classList.add('correct');
    }
  });

  if(index === q.answer) {
    score++;
    scoreEl.textContent = `Puntaje: ${score}`;
  } else {
    btn.classList.add('incorrect');
  }

  explanationEl.innerHTML = `<strong>Explicación:</strong> ${q.explanation}`;
  explanationEl.style.display = 'block';

  nextBtn.disabled = false;
}

function nextQuestion() {
  currentQuestion++;

  if(currentQuestion >= questions.length) {
    showFinal();
    return;
  }

  loadQuestion();
}

function showFinal() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('final-screen').style.display = 'block';

  const percent = ((score / questions.length) * 100).toFixed(1);

  document.getElementById('final-score').innerHTML = `Resultado: ${score}/${questions.length}<br>${percent}%`;
}

function restartQuiz() {
  currentQuestion = 0;
  score = 0;
  scoreEl.textContent = 'Puntaje: 0';

  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('final-screen').style.display = 'none';

  loadQuestion();
}

loadQuestion();
</script>
