<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMMVOL_STUDIOS // CENTRAL_NODE</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff41;
            --terminal-dim: #003b00;
            --accent-cyan: #00f2ff;
            --text-main: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Scanline effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .terminal {
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border: 1px solid var(--terminal-dim);
            background: rgba(0, 20, 0, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.1);
            position: relative;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.2rem;
            color: var(--terminal-green);
            margin-bottom: 30px;
            text-shadow: 2px 2px var(--terminal-dim);
        }

        .menu {
            list-style: none;
            padding: 0;
        }

        .menu li {
            margin: 20px 0;
            font-size: 1.1rem;
        }

        .menu a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: all 0.3s;
            display: block;
            padding: 10px;
            border-left: 3px solid transparent;
        }

        .menu a:hover {
            color: var(--terminal-green);
            border-left: 3px solid var(--terminal-green);
            background: rgba(0, 255, 65, 0.05);
            padding-left: 20px;
        }

        .status {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--terminal-dim);
            border-top: 1px solid var(--terminal-dim);
            padding-top: 20px;
        }

        .blink { animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0; } }

        .tag {
            color: var(--terminal-green);
            font-size: 0.7rem;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="terminal">
        <h1>EMMVOL_STUDIOS_ROOT</h1>
        <p>SELECT ACCESS POINT:</p>
        
        <ul class="menu">
            <li>
                <a href="https://emmvol.github.io/triage-panic-web/">
                    <span class="tag">[PROJ]</span> TRIAGE_PANIC // MAIN_HUB
                </a>
            </li>
            <li>
                <a href="https://emmvol.github.io/triage-panic-web/#privacy-policy">
                    <span class="tag">[DOCS]</span> TRIAGE_PANIC // PRIVACY_POLICY
                </a>
            </li>
            <li>
                <a href="mailto:emmvol.dev@gmail.com">
                    <span class="tag">[COMM]</span> CONTACT_DEVELOPER
                </a>
            </li>
        </ul>

        <div class="status">
            NODE_STATUS: ONLINE <span class="blink">_</span><br>
            LOCATION: https://emmvol.github.io/app-ads.txt [ACTIVE]
        </div>
    </div>
</body>
</html>
