      display: flex;  
      justify-content: center;

    }

    }

    }

      margin-bottom: 20px;  
    }  
  
    .answers {

      gap: 12px;  
    }  
  
    button.answer {  
     border: none;
  border-radius: 12px;

  font-weight: bold;

}

/* colores por posición usando nth-child */
.answers button:nth-child(1) { background: #e53935; }
.answers button:nth-child(2) { background: #1e88e5; }
.answers button:nth-child(3) { background: #43a047; }
.answers button:nth-child(4) { background: #fbc02d; color: black; }
  
    .correct { outline: 4px solid #00ff99; }

</head>

let currentQuestion = 0;  
let score = 0;  
let answered = false;  
  
const questionEl = document.getElementById("question");  
const answersEl = document.getElementById("answers");  
const counterEl = document.getElementById("counter");  
const scoreEl = document.getElementById("score");  
const explanationEl = document.getElementById("explanation");  
  
function loadQuestion() {  
  answered = false;  
  const q = questions[currentQuestion];  
  
  counterEl.textContent = `Pregunta ${currentQuestion + 1} / ${questions.length}`;  
  questionEl.textContent = q.q;  
  
  answersEl.innerHTML = "";  
  explanationEl.style.display = "none";  
  document.getElementById("nextBtn").disabled = true;  
  
  q.options.forEach((opt, i) => {  
    const btn = document.createElement("button");  
    btn.className = "answer";  
    btn.textContent = opt;  
  
    btn.onclick = () => selectAnswer(i, btn);  
  
    answersEl.appendChild(btn);  
  });  
}  
  
function selectAnswer(i, btn) {  
  if (answered) return;  
  answered = true;  
  
  const q = questions[currentQuestion];  
  
  if (i === q.answer) {  
    btn.classList.add("correct");  
    score++;  
  } else {  
    btn.classList.add("incorrect");  
  }  
  
  scoreEl.textContent = "Puntaje: " + score;  
  explanationEl.style.display = "block";  
  explanationEl.textContent = q.explanation;  
  
  document.getElementById("nextBtn").disabled = false;  
}  
  
function nextQuestion() {  
  currentQuestion++;  
  
  if (currentQuestion >= questions.length) {  
    document.getElementById("quiz-screen").style.display = "none";  
    document.getElementById("final-screen").style.display = "block";  
    document.getElementById("final-score").textContent =  
      `Puntaje final: ${score} / ${questions.length}`;  
    return;  
  }  
  
  loadQuestion();  
}  
  
function restartQuiz() {  
  currentQuestion = 0;  
  score = 0;  
  document.getElementById("quiz-screen").style.display = "block";  
  document.getElementById("final-screen").style.display = "none";  
  loadQuestion();  
}
